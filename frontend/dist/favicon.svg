<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" preserveAspectRatio="xMidYMid meet" fill="none">
  <defs>
    <!-- Emerald Green Gradient -->
    <linearGradient id="emeraldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Dual Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Elegant Crescent Moon (Emerald Green) -->
  <path d="M 68 8 C 36 8 10 32 10 60 C 10 82 28 94 50 94 C 66 94 80 86 86 74 C 70 82 52 80 38 68 C 24 54 26 34 44 20 C 52 14 60 10 68 8 Z" fill="url(#emeraldGrad)" />

  <!-- Inner Crescent Golden Glow Accent Line -->
  <path d="M 44 22 C 28 36 26 54 39 68 C 50 79 66 81 82 74" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Mosque Silhouette: Base / Platform -->
  <path d="M 36 82 L 80 82" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Left Minaret -->
  <path d="M 40.5 82 L 40.5 56 L 43.5 56 L 43.5 82 Z" fill="url(#emeraldGrad)" />
  <rect x="39" y="54" width="6" height="2.5" rx="0.8" fill="url(#goldGrad)" />
  <path d="M 39.5 54 C 40 48 42 43 42 39 C 42 43 44 48 44.5 54 Z" fill="url(#goldGrad)" />
  <circle cx="42" cy="38" r="1" fill="url(#goldGrad)" />

  <!-- Right Minaret -->
  <path d="M 72.5 82 L 72.5 54 L 75.5 54 L 75.5 82 Z" fill="url(#emeraldGrad)" />
  <rect x="71" y="52" width="6" height="2.5" rx="0.8" fill="url(#goldGrad)" />
  <path d="M 71.5 52 C 72 46 74 41 74 37 C 74 41 76 46 76.5 52 Z" fill="url(#goldGrad)" />
  <circle cx="74" cy="36" r="1" fill="url(#goldGrad)" />

  <!-- Central Mosque Building Structure -->
  <path d="M 46 82 L 46 64 L 70 64 L 70 82 Z" fill="url(#emeraldGrad)" opacity="0.95" />

  <!-- Central Grand Dome (Qubba) -->
  <path d="M 46 64 C 46 54 52 46 58 40 C 64 46 70 54 70 64 Z" fill="url(#goldGrad)" />
  <!-- Crescent Finial on Central Dome -->
  <path d="M 58 40 L 58 34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 58 33 C 56.5 33 55.5 32 55.5 30.5 C 55.5 29 56.5 28 58 28 C 57.2 28.6 57 29.8 57.5 30.5 C 58 31.2 59 31.4 59.8 31 C 59.5 32.2 58.8 33 58 33 Z" fill="url(#goldGrad)" />

  <!-- Arched Main Doorway (Mihrab Arch) -->
  <path d="M 54 82 L 54 72 C 54 68 62 68 62 72 L 62 82 Z" fill="rgba(4, 120, 87, 0.35)" />
  <path d="M 54 82 L 54 72 C 54 68 62 68 62 72 L 62 82" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />

  <!-- Subtle 8-Pointed Star -->
  <g transform="translate(78, 20) scale(0.9)">
    <path d="M 0 -8 L 2.4 -2.4 L 8 0 L 2.4 2.4 L 0 8 L -2.4 2.4 L -8 0 L -2.4 -2.4 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFBEB" />
  </g>
</svg>